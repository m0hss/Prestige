baseURL      = "https://prestige-demo.example.org/"
locale       = "en"
title        = "Prestige"
enableRobotsTXT = true

# The theme is this repository, imported as a Hugo Module and resolved from the local
# checkout, so `cd exampleSite && hugo server` works whatever the folder is called.
[module]
  replacements = "github.com/m0hss/Prestige -> ../.."
  [module.hugoVersion]
    min = "0.146.0"
  [[module.imports]]
    path = "github.com/m0hss/Prestige"

[taxonomies]
  discipline = "disciplines"
  stack      = "stack"
  lesson     = "lessons"

[permalinks.page]
  work     = "/work/:contentbasename/"
  trapdoor = "/trapdoor/:contentbasename/"

[markup.highlight]
  noClasses  = false
  lineNos    = false
  guessSyntax = false
  tabWidth   = 2

[markup.goldmark.renderer]
  unsafe = false

[markup.goldmark.parser]
  wrapStandAloneImageWithinParagraph = false

[imaging]
  resampleFilter = "CatmullRom"
  anchor = "Smart"
  [imaging.exif]
    disableLatLong = true

[outputs]
  home = ["html", "rss", "headers"]

[[menus.main]]
  name = "Work"
  pageRef = "/work"
  weight = 10
[[menus.main]]
  name = "Trapdoor"
  pageRef = "/trapdoor"
  weight = 20
[[menus.main]]
  name = "About"
  pageRef = "/about"
  weight = 30

[params]
  description = "Prestige: backend systems and live-event logistics, shown as results and as the working behind them."
  [params.author]
    name = "Prestige"
    role = "Backend engineer and production lead"
    location = "Ghent, Belgium"
  [params.contact]
    email = "hello@prestige-demo.example.org"
    availability = "Booking from March 2027"
    [[params.contact.links]]
      label = "Code"
      url = "https://github.com/m0hss/Prestige"
    [[params.contact.links]]
      label = "Write-ups"
      url = "#"
  [params.stage]
    default_mode = "performance"
    programme_from = 5
    trapdoor_on_home = true
  [params.scheme]
    switch = true
  [params.footer]
    description = "Backend engineer and production lead in Ghent. Each case study leads with the result and keeps the working one toggle away."
    note = "Available for cutovers, festivals and flows that make people write in."
  credit = true
