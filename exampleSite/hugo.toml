baseURL      = "https://prestige-demo.example.org/"
locale       = "en"
title        = "Tomás Reyes"
theme        = "prestige"
enableRobotsTXT = true

[module.hugoVersion]
  min = "0.146.0"

[taxonomies]
  discipline = "disciplines"
  stack      = "stack"
  lesson     = "lessons"

[permalinks.page]
  work     = "/work/:slug/"
  trapdoor = "/trapdoor/:slug/"

[markup.highlight]
  noClasses  = false
  lineNos    = false
  guessSyntax = false
  tabWidth   = 2

[markup.goldmark.renderer]
  unsafe = false

[markup.goldmark.parser]
  wrapStandAloneImageWithinParagraph = false

[imaging]
  resampleFilter = "CatmullRom"
  anchor = "Smart"
  [imaging.exif]
    disableLatLong = true

[outputs]
  home = ["html", "rss"]

[[menus.main]]
  name = "Work"
  pageRef = "/work"
  weight = 10
[[menus.main]]
  name = "Trapdoor"
  pageRef = "/trapdoor"
  weight = 20
[[menus.main]]
  name = "About"
  pageRef = "/about"
  weight = 30

[params]
  description = "Tomás Reyes: backend systems and live-event logistics, shown as results and as the working behind them."
  [params.author]
    name = "Tomás Reyes"
    role = "Backend engineer and production lead"
    location = "Ghent, Belgium"
  [params.contact]
    email = "hello@prestige-demo.example.org"
    availability = "Booking from March 2027"
    [[params.contact.links]]
      label = "Code"
      url = "https://github.com/prestige-demo"
    [[params.contact.links]]
      label = "Write-ups"
      url = "https://prestige-demo.example.org/writeups/"
  [params.stage]
    default_mode = "performance"
    programme_from = 5
    trapdoor_on_home = true
  [params.scheme]
    switch = true
  [params.footer]
    note = "Available for cutovers, festivals and flows that make people write in."
  credit = true
