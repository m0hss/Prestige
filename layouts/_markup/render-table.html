<div class="table-scroll" tabindex="0" role="region" aria-label="{{ i18n "table_region" }}">
  <table>
    {{- with .THead }}
    <thead>
      {{- range . }}
      <tr>
        {{- range . }}<th{{ with .Alignment }} class="ta-{{ . }}"{{ end }} scope="col">{{ .Text }}</th>{{ end }}
      </tr>
      {{- end }}
    </thead>
    {{- end }}
    <tbody>
      {{- range .TBody }}
      <tr>
        {{- range . }}<td{{ with .Alignment }} class="ta-{{ . }}"{{ end }}>{{ .Text }}</td>{{ end }}
      </tr>
      {{- end }}
    </tbody>
  </table>
</div>
