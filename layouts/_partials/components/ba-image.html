{{- /* Before/after images (7.4). Context: dict before after before_alt after_alt before_label after_label caption id. */ -}}
<figure class="ba ba--image">
  <div class="ba__grid">
    {{- range $side := slice "before" "after" }}
    {{- $id := printf "%s-%s" $.id $side }}
    <div class="ba__pane" data-side="{{ $side }}" role="group" aria-labelledby="{{ $id }}">
      <p class="chip chip--{{ $side }}" id="{{ $id }}"><span aria-hidden="true">{{ cond (eq $side "before") "○" "●" }} </span>{{ index $ (printf "%s_label" $side) }}</p>
      {{ partial "lib/img.html" (dict "res" (index $ $side) "alt" (index $ (printf "%s_alt" $side)) "widths" (slice 480 800 1200) "sizes" "(min-width: 60rem) 340px, (min-width: 40rem) 45vw, 100vw") }}
    </div>
    {{- if eq $side "before" }}
    <p class="ba__link" aria-hidden="true"><span class="ba__arrow arrow arrow--right"></span><span class="ba__then">{{ i18n "ba_then" }} ↓</span></p>
    {{- end }}
    {{- end }}
  </div>
  {{- with .caption }}
  <figcaption class="ba__caption">{{ . }}</figcaption>
  {{- end }}
</figure>
