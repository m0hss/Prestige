{{- /* Self-hosted fonts: preloads plus inline @font-face with fingerprinted URLs (6.3). Built in lib/inline-assets.html. */ -}}
{{- $inline := partialCached "lib/inline-assets.html" . "inline" -}}
{{- range $inline.preload }}
<link rel="preload" href="{{ . }}" as="font" type="font/woff2" crossorigin>
{{- end }}
<style>{{ $inline.css | safeCSS }}</style>
